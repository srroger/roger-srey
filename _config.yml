# --- Métadonnées du site ---
title: Roger's homepage
description: Ingénieur développeur & harmoniciste amateur, Sur Terre, nous naissons tous égaux mais certains sont plus égaux que d'autres.
author: Roger Srey
email: roger_srey@hotmail.com
github_username: srroger
lang: fr-FR
encoding: UTF-8

# Active la recherche Pagefind dans le layout. L'index n'existe qu'après un
# build via GitHub Actions (voir .github/workflows/pages.yml).
pagefind: true

# --- Rendu Markdown ---
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true # génère une ancre pour chaque titre
  gfm_quirks: paragraph_end

# --- Plugins (déclarés dans le Gemfile) ---
plugins:
  - jekyll-default-layout # applique _layouts/default.html aux pages sans layout
  - jekyll-relative-links # réécrit les liens Markdown relatifs (ex. ./Inventaire)

# --- Fichiers exclus du site publié ---
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

# --- Sass ---
sass:
  sass_dir: assets/css/
