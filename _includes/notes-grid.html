{%- comment -%}
Grille de cartes générée depuis _data/notes.yml.
Inclus dans l'accueil (index.md) avec la balise include.
{%- endcomment -%}
<div class="notes-grid">
  {%- for note in site.data.notes %}
  <a class="note-card" href="{{ note.url | relative_url }}">
    <span class="note-card__icon" aria-hidden="true">{{ note.icon }}</span>
    <span class="note-card__title">{{ note.title }}</span>
    <span class="note-card__desc">{{ note.desc }}</span>
  </a>
  {%- endfor %}
</div>
