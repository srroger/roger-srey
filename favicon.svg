<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Roger Srey — un R tracé dans une radiographie d'harmonica">
  <title>Roger Srey — un R tracé dans une radiographie d'harmonica</title>
  <!-- Tuile vectorielle ; l'image ne contient que la lettre (fond transparent).
       Le R est decoupe dans le PNG lui-meme : pas de clipPath, donc aucun
       moteur de rendu ne peut l'ignorer. -->
  <rect width="256" height="256" rx="46" fill="#1a1612"/>
  <image x="0" y="0" width="256" height="256" href="data:image/png;base64,"/>
</svg>
